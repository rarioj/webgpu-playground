<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/external/pico.css" />
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico" />
    <title></title>
  </head>
  <body>
    <main>
      <section></section>
      <article></article>
      <footer>
        <nav>
          <ul>
            <li
              ><strong><a href="https://rarioj.github.io/webgpu-playground/">WebGPU Playground</a></strong></li
            >
          </ul>
          <ul>
            <li
              ><a href="https://webgpu.org/"><img src="./assets/icons/webgpu-horizontal.svg" style="width: auto; height: 36px; margin-top: 8px" /></a
            ></li>
            <li
              ><a href="https://picocss.com/"
                ><img
                  class="theme-toggle"
                  src="./assets/icons/pico-dark.svg"
                  data-light-icon="./assets/icons/pico-light.svg"
                  data-dark-icon="./assets/icons/pico-dark.svg"
                  style="width: auto; height: 32px" /></a
            ></li>
            <li
              ><a href="https://github.com/rarioj/webgpu-playground"
                ><img
                  class="theme-toggle"
                  src="./assets/icons/github-dark.svg"
                  data-light-icon="./assets/icons/github-light.svg"
                  data-dark-icon="./assets/icons/github-dark.svg"
                  style="width: auto; height: 32px; margin-top: 4px" /></a
            ></li>
            <li id="theme-toggle"></li>
          </ul>
        </nav>
      </footer>
    </main>
    <script type="module">
      import { serveMarkdown, applyThemeCreateToggle } from "./src/helper/content.js";
      await serveMarkdown("./INDEX.md", document.querySelector("section"));
      const breadcrumb = document.querySelector("h6");
      document.title = breadcrumb ? breadcrumb.innerText : "WebGPU Playground";
      applyThemeCreateToggle(document.getElementById("theme-toggle"));
    </script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
