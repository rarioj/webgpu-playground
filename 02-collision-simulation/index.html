<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collision Simulation | WebGPU Playground</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css" />
  </head>
  <body>
    <main>
      <header>
        <hgroup>
          <h1>Collision Simulation</h1>
          <p>Implementation of <a target="_blank" href="https://surma.dev/things/webgpu/">WebGPU — All of the cores, none of the canvas</a></p>
        </hgroup>
      </header>
      <section>
        <canvas style="outline: 1px solid black" width="512" height="512"></canvas>
      </section>
      <footer>
        <p>You can adjust and append the following parameters to the URL:<br /><code>?balls=100&min_radius=2&max_radius=10&width=512&height=512</code></p>
      </footer>
    </main>
    <script type="module" src="./script.js"></script>
  </body>
</html>
